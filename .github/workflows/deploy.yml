name: Deploy to Zomro

on:
  push:
    branches:
      - main
      - master
      - work
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Оформление заказа
        uses: actions/checkout@v4

      - name: Установить ключ SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ZOMRO_SSH_KEY }}

      - name: Добавить хост в known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.ZOMRO_PORT }} -H ${{ secrets.ZOMRO_HOST }} >> ~/.ssh/known_hosts

      - name: Развертывание с помощью rsync
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            -e "ssh -p ${{ secrets.ZOMRO_PORT }}" \
            ./ ${{ secrets.ZOMRO_USER }}@${{ secrets.ZOMRO_HOST }}:${{ secrets.ZOMRO_PATH }}
