name: Deploy to Zomro

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Проверить сервер ФИЗМАТ до SSH-подключения
        env:
          TARGET_HOST: ${{ secrets.ZOMRO_HOST }}
          TARGET_PATH: ${{ secrets.ZOMRO_PATH }}
          TARGET_USER: ${{ secrets.ZOMRO_USER }}
          TARGET_PORT: ${{ secrets.ZOMRO_PORT }}
        run: |
          set -euo pipefail
          if [ "$TARGET_HOST" != "212.43.148.98" ] || [ "${TARGET_PATH%/}" != "/var/www/physoge" ]; then
            echo "Остановка: разрешён только сервер 212.43.148.98 и каталог /var/www/physoge."
            exit 1
          fi
          test -n "$TARGET_USER" || { echo "Не указан пользователь SSH."; exit 1; }
          [[ "$TARGET_PORT" =~ ^[0-9]+$ ]] || { echo "Некорректный порт SSH."; exit 1; }

      - name: Установить ключ SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ZOMRO_SSH_KEY }}

      - name: Добавить хост в known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.ZOMRO_PORT }} -H ${{ secrets.ZOMRO_HOST }} >> ~/.ssh/known_hosts

      - name: Вставить фотографию прямо в шаблон теории урока 62
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('index.html')
          html = page.read_text(encoding='utf-8')
          anchor = '${renderTheory()}'
          flag = 'fizmat-theory62-original-png'
          if flag not in html:
              if html.count(anchor) != 1:
                  raise SystemExit('Остановка: шаблон вкладки «Теория» изменился — безопасная вставка невозможна')
              markup = (
                  '<figure id="fizmat-theory62-original-png" style="width:100%;margin:0 0 20px;">'
                  '<img src="lesson-62-potential-energy.png" '
                  'alt="Потенциал и потенциальная энергия — теория ЕГЭ" '
                  'class="theory-carousel-img universal-viewable-image image-carousel-img" '
                  'style="display:block;width:100%;height:auto;object-fit:contain;border-radius:12px" '
                  'onerror="this.style.display=\'none\';this.insertAdjacentHTML(\'afterend\',\'<p style=&quot;color:#b91c1c&quot;>Не удалось загрузить изображение урока 62.</p>\')">'
                  '</figure>'
              )
              replacement = "${((AC==='ege-phy'&&CM===8&&CL===9)? " + repr(markup) + " : '') + renderTheory()}"
              html = html.replace(anchor, replacement, 1)
              page.write_text(html, encoding='utf-8')
          PY

      - name: Добавить задачу по зарядам во вкладку «Задачи» урока 59
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('index.html')
          html = page.read_text(encoding='utf-8')
          anchor = '${renderPTasks(name)}'
          flag = 'fizmat-lesson59-charge-direction'
          if flag not in html:
              if html.count(anchor) != 1:
                  raise SystemExit('Не найден единственный шаблон задач; прекращаем публикацию без изменений')
              markup = (
                  '<article id="fizmat-lesson59-charge-direction" class="pt-card" style="margin:16px 0;padding:18px;border:1px solid var(--border);border-radius:14px;">'
                  '<div class="pt-head" style="margin-bottom:12px;"><span class="pt-exam">ЕГЭ · Электростатика</span> '
                  '<strong class="pt-title">Направление ускорения отрицательного заряда</strong></div>'
                  '<img src="images/course/ege-phy/m-8/l-1/tasks/59-task-charge-direction.svg" '
                  'alt="Условие задачи о зарядах минус q, плюс Q и минус Q и схема их расположения" '
                  'class="universal-viewable-image image-carousel-img" '
                  'style="display:block;width:100%;height:auto;object-fit:contain;background:white;border-radius:8px;cursor:zoom-in" '
                  'onerror="this.insertAdjacentHTML(\'afterend\',\'<p>Изображение задачи не загрузилось.</p>\')">'
                  '</article>'
              )
              replacement = "${renderPTasks(name)+((AC==='ege-phy'&&CM===8&&CL===1)? " + repr(markup) + " : '')}"
              html = html.replace(anchor, replacement, 1)
              page.write_text(html, encoding='utf-8')
          PY

      - name: Проверить наличие изображения урока 62
        run: |
          test -s images/ege-physics/lesson-62/theory/potential-energy.png.png

      - name: Подготовить список файлов без удаления серверных материалов
        run: |
          printf '%s\n' 'index.html' 'assets/lesson-62-potential-energy.js' 'images/course/ege-phy/m-8/l-1/tasks/59-task-charge-direction.svg' > /tmp/fizmat-deploy-files
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only --diff-filter=ACMRT HEAD^ HEAD >> /tmp/fizmat-deploy-files
          fi
          grep -v -E '^\.git(hub)?/' /tmp/fizmat-deploy-files | sort -u | while IFS= read -r file; do
            if [ -f "$file" ]; then printf '%s\n' "$file"; fi
          done > /tmp/fizmat-deploy-existing
          echo "Файлы для отправки:"
          cat /tmp/fizmat-deploy-existing

      - name: Создать резервную копию действующего сайта на Zomro
        env:
          TARGET_HOST: ${{ secrets.ZOMRO_HOST }}
          TARGET_PORT: ${{ secrets.ZOMRO_PORT }}
          TARGET_USER: ${{ secrets.ZOMRO_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -p "$TARGET_PORT" "$TARGET_USER@$TARGET_HOST" 'set -eu
            test -d /var/www/physoge || { echo "Папка сайта не найдена — публикация отменена."; exit 1; }
            backup_dir="$HOME/physoge-backups"
            mkdir -p "$backup_dir"
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            backup_file="$backup_dir/physoge-$stamp.tar.gz"
            tar -C /var/www -czf "$backup_file" physoge
            test -s "$backup_file" || { echo "Не удалось создать резервную копию."; exit 1; }
            echo "Резервная копия создана: $backup_file"
          '

      - name: Передать исходный PNG урока 62 без сжатия в корень сайта
        run: |
          set -euo pipefail
          test -s images/ege-physics/lesson-62/theory/potential-energy.png.png
          rsync -az --no-perms --no-owner --no-group \
            -e "ssh -p ${{ secrets.ZOMRO_PORT }}" \
            images/ege-physics/lesson-62/theory/potential-energy.png.png \
            "${{ secrets.ZOMRO_USER }}@${{ secrets.ZOMRO_HOST }}:${{ secrets.ZOMRO_PATH }}/lesson-62-potential-energy.png"

      - name: Развернуть изменённые файлы на Zomro
        run: |
          rsync -az --no-perms --no-owner --no-group --omit-dir-times \
            --files-from=/tmp/fizmat-deploy-existing \
            -e "ssh -p ${{ secrets.ZOMRO_PORT }}" \
            ./ ${{ secrets.ZOMRO_USER }}@${{ secrets.ZOMRO_HOST }}:${{ secrets.ZOMRO_PATH }}
