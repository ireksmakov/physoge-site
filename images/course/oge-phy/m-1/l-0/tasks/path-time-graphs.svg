    <dc:title>Варианты графиков зависимости пройденного пути от времени</dc:title>
    <dc:description>Четыре варианта: 1 — путь начинается ниже нуля и возрастает; 2 — возрастает, затем убывает до нуля; 3 — возрастает от нуля, затем остаётся постоянным; 4 — убывает, затем остаётся постоянным.</dc:description>
