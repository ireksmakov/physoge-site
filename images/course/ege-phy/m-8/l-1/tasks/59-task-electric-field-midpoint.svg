<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="t d">
<title id="t">Направление напряжённости электрического поля в точке B</title>
<desc id="d">Точка B находится посередине отрезка AC. В A находится заряд +q, в C — заряд −5q. Определите направление результирующей напряжённости в B.</desc>
<rect width="1600" height="440" fill="#fff"/>
<g fill="#222" font-family="Times New Roman,Times,serif" font-size="32">
<text x="28" y="50">Точка B находится посередине отрезка AC. Неподвижные точечные</text>
<text x="28" y="94">заряды +q &gt; 0 и −5q расположены в точках A и C соответственно</text>
<text x="28" y="138">(см. рисунок). Куда направлен относительно рисунка (вправо,</text>
<text x="28" y="182">влево, вверх, вниз, к наблюдателю, от наблюдателя) вектор</text>
<text x="28" y="226">напряжённости результирующего электрического поля этих</text>
<text x="28" y="270">зарядов в точке B?</text>
<text x="28" y="346" font-style="italic">Ответ запишите словом (словами).</text>
</g>
<path d="M1230 212H1534" stroke="#242424" stroke-width="2.4" stroke-dasharray="10 9"/>
<g fill="#151515">
<circle cx="1230" cy="212" r="9"/><circle cx="1382" cy="212" r="5"/><circle cx="1534" cy="212" r="9"/>
</g>
<g fill="#151515" font-family="Times New Roman,Times,serif" font-size="42" font-style="italic" font-weight="bold" text-anchor="middle">
<text x="1230" y="165">+q</text><text x="1534" y="165">−5q</text>
<text x="1230" y="267">A</text><text x="1382" y="267">B</text><text x="1534" y="267">C</text>
</g>
</svg>