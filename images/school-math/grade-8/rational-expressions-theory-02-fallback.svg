<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Преобразование рациональных выражений. Теория 2 из 4">
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#e5f7ff"/><stop offset="1" stop-color="#bde7ff"/></linearGradient><linearGradient id="panel" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f2faff"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="28" y="25" width="1544" height="95" rx="20" fill="#d9efff" opacity=".8"/>
<text x="64" y="90" font-family="Arial,sans-serif" font-size="55" font-weight="700" fill="#072959">Преобразование рациональных выражений</text>
<rect x="62" y="127" width="268" height="55" rx="28" fill="#a6dcfa"/>
<text x="87" y="166" font-family="Arial,sans-serif" font-size="35" fill="#08346a">Теория · 2/4</text>
<g><rect x="1442" y="132" width="80" height="22" rx="4" fill="#1673c3"/><rect x="1423" y="152" width="95" height="24" rx="4" fill="#fff" stroke="#1673c3" stroke-width="3"/><rect x="1438" y="175" width="83" height="16" rx="4" fill="#00559a"/></g>
<rect x="35" y="206" width="640" height="613" rx="22" fill="url(#panel)" stroke="#a5d9f4" stroke-width="3"/>
<rect x="47" y="218" width="616" height="61" rx="22" fill="#d2efff"/>
<text x="72" y="261" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#07346a">Алгоритм преобразования</text>
<text x="72" y="311" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#123154">1. Найти ОДЗ исходного выражения.</text>
<text x="72" y="353" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#123154">2. Разложить на множители.</text>
<text x="72" y="395" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#123154">3. Сократить общие множители.</text>
<text x="72" y="437" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#123154">4. Привести к общему знаменателю.</text>
<text x="72" y="479" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#123154">5. Выполнить действия.</text>
<text x="72" y="521" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#123154">6. Записать упрощённый ответ.</text>
<text x="72" y="563" font-family="Times New Roman,Georgia,serif" font-size="34" font-weight="400" fill="#123154">a² − b² = (a − b)(a + b)</text>
<text x="72" y="605" font-family="Times New Roman,Georgia,serif" font-size="32" font-weight="400" fill="#123154">(a + b)² = a² + 2ab + b²</text>
<text x="72" y="647" font-family="Times New Roman,Georgia,serif" font-size="32" font-weight="400" fill="#123154">(a − b)² = a² − 2ab + b²</text>
<rect x="694" y="206" width="871" height="613" rx="22" fill="url(#panel)" stroke="#a5d9f4" stroke-width="3"/>
<rect x="706" y="218" width="847" height="61" rx="22" fill="#ddf9ef"/>
<text x="731" y="261" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#07346a">Пример 1. Представим в виде дроби</text>
<text x="731" y="311" font-family="Times New Roman,Georgia,serif" font-size="35" font-weight="400" fill="#123154">x + 1 − [1/(x + 2)] · [(x² − 4)/x]</text>
<text x="731" y="353" font-family="Times New Roman,Georgia,serif" font-size="34" font-weight="400" fill="#123154">1)  x² − 4 = (x − 2)(x + 2)</text>
<text x="731" y="395" font-family="Times New Roman,Georgia,serif" font-size="33" font-weight="400" fill="#123154">2)  [(x²−4)/(x(x+2))] = (x−2)/x</text>
<text x="731" y="437" font-family="Times New Roman,Georgia,serif" font-size="33" font-weight="400" fill="#123154">3)  x+1−(x−2)/x</text>
<text x="731" y="479" font-family="Times New Roman,Georgia,serif" font-size="33" font-weight="400" fill="#123154">     = [x(x+1)−(x−2)]/x</text>
<text x="731" y="521" font-family="Times New Roman,Georgia,serif" font-size="40" font-weight="700" fill="#057d7d">     = (x² + 2)/x</text>
<text x="731" y="563" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#123154">Исходные ограничения: x ≠ 0, x ≠ −2.</text>
<text x="731" y="605" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#123154">Ответ: (x² + 2)/x.</text>
<rect x="28" y="838" width="1544" height="47" rx="20" fill="#f9feff" stroke="#96d5f7" stroke-width="2"/>
<text x="58" y="871" font-family="Arial,sans-serif" font-size="24" fill="#074277" font-weight="600">Сначала учитывайте ОДЗ, затем выполняйте преобразования.</text>
</svg>