<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Пошаговое решение задачи об изотермическом сжатии">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e1f4ff"/><stop offset="1" stop-color="#badffa"/></linearGradient><linearGradient id="gas" x2="0" y2="1"><stop stop-color="#b5edff"/><stop offset="1" stop-color="#70c8f8"/></linearGradient><style>
text{font-family:"Times New Roman",Times,serif;fill:#071c4f} .h{font-size:55px;font-weight:bold}.sub{font-size:31px;font-weight:bold}.b{font-size:27px}.s{font-size:24px}.formula{font-size:36px;font-style:italic}.panel{fill:#f7fcff;fill-opacity:.83;stroke:#1764af;stroke-width:2}.pill{fill:#c0e5fa}.step{fill:#b2dff9;stroke:#478bc6;stroke-width:1.4}.rule{stroke:#153e82;stroke-width:3;stroke-linecap:round}
</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="520" y="16" width="560" height="54" rx="22" fill="#104482"/><text x="800" y="54" font-size="36" font-weight="bold" text-anchor="middle" fill="white">Базовый ЕГЭ · часть 1</text>
<path d="M54 121H390M1210 121H1546" class="rule"/><text x="800" y="139" class="h" text-anchor="middle">Изотермическое сжатие</text>
<rect x="17" y="167" width="1566" height="119" rx="15" class="panel"/><rect x="34" y="192" width="183" height="61" rx="10" class="pill"/><text x="126" y="234" font-size="35" font-weight="bold" text-anchor="middle">Задача</text><path d="M235 177V276" class="rule"/>
<text x="260" y="207" class="b">При неизменной температуре давление постоянной массы идеального газа равно</text><text x="260" y="245" class="b">120 кПа, а объём — 3 л. Газ медленно сжали до 2 л. Определите конечное давление газа.</text>
<rect x="17" y="308" width="251" height="445" rx="17" class="panel"/><rect x="34" y="325" width="216" height="52" rx="10" class="pill"/><text x="54" y="363" class="sub">Дано:</text>
<text x="43" y="426" class="sub" font-style="italic">P₁ = 120 кПа</text><text x="43" y="480" class="sub" font-style="italic">V₁ = 3 л</text><text x="43" y="535" class="sub" font-style="italic">V₂ = 2 л</text><text x="43" y="590" class="sub" font-style="italic">T = const</text><text x="43" y="644" class="sub" font-style="italic">m = const</text><path d="M36 662H249" class="rule"/><rect x="34" y="682" width="216" height="43" rx="9" class="pill"/><text x="48" y="713" class="sub">Найти:</text><text x="160" y="741" class="s" text-anchor="middle" font-style="italic">P₂ — ?</text>
<rect x="280" y="308" width="397" height="548" rx="18" class="panel"/>
<g stroke="#103c7e" stroke-width="3" fill="none"><path d="M320 425V688Q320 703 335 704H447Q462 703 462 687V425"/><path d="M495 425V688Q495 703 510 704H622Q637 703 637 687V425"/></g>
<path d="M323 518H459V688Q459 701 447 701H335Q323 701 323 688Z" fill="url(#gas)"/><path d="M498 574H634V688Q634 701 622 701H510Q498 701 498 688Z" fill="url(#gas)"/>
<g stroke="#0d4080" stroke-width="3" fill="#deecfb"><ellipse cx="391" cy="517" rx="68" ry="17"/><ellipse cx="566" cy="573" rx="68" ry="17"/><path d="M383 360H399V513H383Z"/><path d="M558 417H574V569H558Z"/></g>
<g fill="#159fe5" opacity=".85"><circle cx="343" cy="551" r="5"/><circle cx="386" cy="576" r="5"/><circle cx="437" cy="552" r="5"/><circle cx="358" cy="634" r="5"/><circle cx="419" cy="665" r="5"/><circle cx="523" cy="610" r="5"/><circle cx="600" cy="615" r="5"/><circle cx="554" cy="653" r="5"/><circle cx="613" cy="677" r="5"/></g>
<path d="M466 556H484" stroke="#0d5798" stroke-width="7"/><path d="M485 556l-13 -11v22Z" fill="#0d5798"/><path d="M524 510V550m84 -40V550" stroke="#103d7e" stroke-width="5"/><path d="M524 552l-9 -15h18Zm84 0l-9 -15h18Z" fill="#103d7e"/>
<text x="392" y="600" class="sub" text-anchor="middle" font-style="italic">P₁</text><text x="392" y="680" class="s" text-anchor="middle">V₁ = 3 л</text><text x="565" y="630" class="sub" text-anchor="middle" font-style="italic">P₂</text><text x="565" y="685" class="s" text-anchor="middle">V₂ = 2 л</text>
<rect x="310" y="724" width="165" height="42" rx="9" class="panel"/><text x="392" y="753" class="s" text-anchor="middle">До сжатия</text><rect x="484" y="724" width="177" height="42" rx="9" class="panel"/><text x="571" y="753" class="s" text-anchor="middle">После сжатия</text><rect x="355" y="789" width="243" height="49" rx="10" class="panel"/><text x="477" y="825" class="sub" text-anchor="middle" font-style="italic">T = const</text>
<rect x="692" y="308" width="891" height="139" rx="16" class="panel"/><rect x="712" y="329" width="65" height="66" rx="12" class="step"/><text x="744" y="376" font-size="44" text-anchor="middle" font-weight="bold">1</text><text x="797" y="355" class="sub">Физическая идея:</text><text x="797" y="390" class="b">Для изотермического процесса постоянной массы</text><text x="797" y="424" class="b">идеального газа выполняется закон Бойля — Мариотта.</text>
<rect x="692" y="458" width="891" height="88" rx="14" class="panel"/><rect x="712" y="472" width="65" height="58" rx="12" class="step"/><text x="744" y="514" font-size="41" text-anchor="middle" font-weight="bold">2</text><text x="799" y="515" class="sub">Формула:</text><rect x="1130" y="467" width="369" height="65" rx="10" class="panel"/><text x="1314" y="514" class="formula" text-anchor="middle">P₁V₁ = P₂V₂</text>
<rect x="692" y="558" width="891" height="94" rx="14" class="panel"/><rect x="712" y="571" width="65" height="65" rx="12" class="step"/><text x="744" y="617" font-size="41" text-anchor="middle" font-weight="bold">3</text><text x="799" y="615" class="sub">Выразим искомую величину:</text><rect x="1310" y="570" width="216" height="65" rx="10" class="panel"/><text x="1418" y="611" class="formula" text-anchor="middle">P₂ = P₁V₁ / V₂</text>
<rect x="692" y="665" width="891" height="90" rx="14" class="panel"/><rect x="712" y="676" width="65" height="65" rx="12" class="step"/><text x="744" y="722" font-size="41" text-anchor="middle" font-weight="bold">4</text><text x="799" y="720" class="sub">Подстановка:</text><rect x="1100" y="677" width="404" height="65" rx="10" class="panel"/><text x="1302" y="721" class="formula" text-anchor="middle">P₂ = (120 · 3) / 2 кПа</text>
<rect x="692" y="767" width="891" height="121" rx="14" class="panel"/><rect x="712" y="783" width="65" height="66" rx="12" class="step"/><text x="744" y="829" font-size="41" text-anchor="middle" font-weight="bold">5</text><text x="799" y="815" class="sub">Вывод:</text><text x="799" y="851" class="b">При уменьшении объёма при изотермическом</text><text x="799" y="880" class="b">сжатии давление газа увеличивается.</text>
</svg>