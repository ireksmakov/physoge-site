<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Механические колебания и волны — виды колебаний</title>
  <desc id="desc">Учебная инфографика ФИЗМАТ: определение колебаний, механические колебания, свободные, вынужденные и автоколебания.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03142c"/><stop offset="0.55" stop-color="#061c3a"/><stop offset="1" stop-color="#040b1b"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b34e6"/><stop offset="1" stop-color="#a832e5"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10c9ef"/><stop offset="1" stop-color="#56e6ff"/>
    </linearGradient>
    <linearGradient id="panelLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#dceeff"/>
    </linearGradient>
    <linearGradient id="panelPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ff"/><stop offset="1" stop-color="#eee2ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrC" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#23d9ff"/></marker>
    <marker id="arrP" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#f15be8"/></marker>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}
      .white{fill:#f6fbff}.ink{fill:#0c1b39}.muted{fill:#9fb4cf}
      .h1{font-size:54px;font-weight:800}.h2{font-size:34px;font-weight:800}.h3{font-size:28px;font-weight:800}
      .body{font-size:25px;font-weight:500}.small{font-size:22px;font-weight:500}
      .card{fill:#081a35;stroke:#1c6690;stroke-width:2}.round{rx:24;ry:24}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 118 C140 50 240 180 390 100 S650 150 790 105 S1060 160 1220 80 S1450 135 1600 55" fill="none" stroke="#0b75d1" stroke-opacity=".45" stroke-width="2"/>
  <path d="M900 120 C1010 45 1080 190 1205 88 S1435 142 1600 72" fill="none" stroke="#a23fff" stroke-opacity=".5" stroke-width="3"/>

  <rect x="28" y="24" width="205" height="58" rx="29" fill="#183b89" stroke="#a8c8ff" stroke-width="2"/>
  <text x="130" y="63" text-anchor="middle" class="sans white" font-size="29" font-weight="800">Механика</text>

  <text x="800" y="67" text-anchor="middle" class="sans white h1">Механические колебания <tspan fill="#28d8ff">и волны</tspan></text>
  <text x="1516" y="47" text-anchor="end" class="sans white" font-size="29" font-weight="900">ФИЗМАТ</text>
  <rect x="1460" y="60" width="58" height="6" rx="3" fill="#29d8ff"/>

  <rect x="605" y="86" width="390" height="54" rx="27" fill="url(#violet)" stroke="#e4c8ff" stroke-width="2" filter="url(#glow)"/>
  <text x="800" y="123" text-anchor="middle" class="sans white" font-size="30" font-weight="800">1. Колебания</text>

  <!-- Definition row -->
  <g filter="url(#shadow)">
    <rect x="28" y="158" width="500" height="215" rx="24" fill="url(#panelLight)"/>
    <path d="M55 270 C75 215 100 215 118 270 S160 320 180 265 S220 215 240 270" fill="none" stroke="#1b81ed" stroke-width="10" stroke-linecap="round"/>
    <text x="270" y="206" class="sans" fill="#4720ac" font-size="30" font-weight="800">Механические</text>
    <text x="270" y="241" class="sans" fill="#4720ac" font-size="30" font-weight="800">колебания и волны —</text>
    <text x="270" y="277" class="sans ink body">раздел механики, изучающий</text>
    <text x="270" y="309" class="sans ink body">колебательные движения</text>
    <text x="270" y="341" class="sans ink body">и распространение колебаний.</text>

    <rect x="550" y="158" width="500" height="215" rx="24" fill="url(#panelPink)"/>
    <circle cx="647" cy="258" r="58" fill="#e1ccff"/><circle cx="647" cy="258" r="42" fill="none" stroke="#5b2ab3" stroke-width="9"/>
    <line x1="647" y1="258" x2="647" y2="223" stroke="#142a67" stroke-width="8" stroke-linecap="round"/>
    <line x1="647" y1="258" x2="672" y2="278" stroke="#142a67" stroke-width="8" stroke-linecap="round"/>
    <path d="M682 212 A55 55 0 0 1 699 275" fill="none" stroke="#5b2ab3" stroke-width="9" marker-end="url(#arrP)"/>
    <text x="735" y="207" class="sans" fill="#4d1fa8" font-size="31" font-weight="800">Колебания —</text>
    <text x="735" y="246" class="sans ink body">движения или процессы,</text>
    <text x="735" y="278" class="sans ink body">которые повторяются через</text>
    <text x="735" y="310" class="sans ink body">определённые интервалы</text>
    <text x="735" y="342" class="sans ink body">времени.</text>

    <rect x="1072" y="158" width="500" height="215" rx="24" fill="url(#panelLight)"/>
    <g transform="translate(1124 204)">
      <circle cx="54" cy="54" r="50" fill="#d4f3ff"/><circle cx="54" cy="54" r="27" fill="#128ac8"/>
      <g fill="#128ac8">
        <rect x="48" y="-2" width="12" height="26" rx="4"/><rect x="48" y="84" width="12" height="26" rx="4"/>
        <rect x="-2" y="48" width="26" height="12" rx="4"/><rect x="84" y="48" width="26" height="12" rx="4"/>
        <rect x="13" y="12" width="18" height="12" rx="4" transform="rotate(-45 22 18)"/><rect x="78" y="78" width="18" height="12" rx="4" transform="rotate(-45 87 84)"/>
        <rect x="78" y="12" width="18" height="12" rx="4" transform="rotate(45 87 18)"/><rect x="13" y="78" width="18" height="12" rx="4" transform="rotate(45 22 84)"/>
      </g>
    </g>
    <text x="1250" y="207" class="sans" fill="#0d4b9e" font-size="31" font-weight="800">Механические</text>
    <text x="1250" y="242" class="sans" fill="#0d4b9e" font-size="31" font-weight="800">колебания —</text>
    <text x="1250" y="280" class="sans ink body">колебания смещения,</text>
    <text x="1250" y="312" class="sans ink body">скорости, ускорения,</text>
    <text x="1250" y="344" class="sans ink body">энергии и других величин.</text>
  </g>

  <!-- Types header -->
  <rect x="36" y="395" width="355" height="58" rx="18" fill="url(#violet)" stroke="#bb64ff" stroke-width="2"/>
  <text x="214" y="434" text-anchor="middle" class="sans white h2">Виды колебаний</text>
  <line x1="392" y1="425" x2="1560" y2="425" stroke="#8e75ff" stroke-width="2" opacity=".8"/>

  <!-- Free oscillations -->
  <g filter="url(#shadow)">
    <rect x="28" y="466" width="500" height="318" rx="24" class="card"/>
    <circle cx="78" cy="516" r="35" fill="url(#cyan)" filter="url(#glow)"/>
    <text x="78" y="529" text-anchor="middle" class="sans white" font-size="35" font-weight="900">1</text>
    <rect x="120" y="484" width="310" height="62" rx="19" fill="#eaf8ff"/>
    <text x="275" y="525" text-anchor="middle" class="sans ink h3">Свободные</text>

    <rect x="72" y="570" width="110" height="20" rx="5" fill="#a8bcdc"/>
    <path d="M127 590 C90 610 164 626 127 642 C90 658 164 674 127 690 C90 706 164 722 127 738" fill="none" stroke="#d9e6f7" stroke-width="9"/>
    <circle cx="127" cy="752" r="29" fill="#b6c7db" stroke="#f5fbff" stroke-width="4"/>
    <line x1="64" y1="648" x2="64" y2="721" stroke="#2de3ff" stroke-width="5" marker-start="url(#arrC)" marker-end="url(#arrC)"/>
    <text x="230" y="593" class="sans white small">Возникают после</text>
    <text x="230" y="625" class="sans white small">однократного воздействия</text>
    <text x="230" y="657" class="sans white small">и далее происходят</text>
    <text x="230" y="689" class="sans white small">без внешнего</text>
    <text x="230" y="721" class="sans white small">периодического воздействия.</text>
  </g>

  <!-- Forced -->
  <g filter="url(#shadow)">
    <rect x="550" y="466" width="500" height="318" rx="24" class="card"/>
    <circle cx="600" cy="516" r="35" fill="#c238e8" filter="url(#glow)"/>
    <text x="600" y="529" text-anchor="middle" class="sans white" font-size="35" font-weight="900">2</text>
    <rect x="642" y="484" width="330" height="62" rx="19" fill="#f5e7ff"/>
    <text x="807" y="525" text-anchor="middle" class="sans ink h3">Вынужденные</text>

    <line x1="632" y1="585" x2="740" y2="750" stroke="#ffc26b" stroke-width="7"/>
    <line x1="800" y1="585" x2="740" y2="750" stroke="#ffc26b" stroke-width="7"/>
    <rect x="668" y="725" width="145" height="23" rx="8" fill="#efaa55"/>
    <path d="M665 770 Q740 812 815 770" fill="none" stroke="#f35de4" stroke-width="5" marker-end="url(#arrP)"/>
    <line x1="840" y1="680" x2="792" y2="696" stroke="#f35de4" stroke-width="6" marker-end="url(#arrP)"/>
    <text x="846" y="593" class="sans white small">Происходят под</text>
    <text x="846" y="625" class="sans white small">действием внешней</text>
    <text x="846" y="657" class="sans white small">периодической силы.</text>
  </g>

  <!-- Auto -->
  <g filter="url(#shadow)">
    <rect x="1072" y="466" width="500" height="318" rx="24" class="card"/>
    <circle cx="1122" cy="516" r="35" fill="url(#cyan)" filter="url(#glow)"/>
    <text x="1122" y="529" text-anchor="middle" class="sans white" font-size="35" font-weight="900">3</text>
    <rect x="1164" y="484" width="330" height="62" rx="19" fill="#eaf8ff"/>
    <text x="1329" y="525" text-anchor="middle" class="sans ink h3">Автоколебания</text>

    <rect x="1128" y="575" width="150" height="172" rx="14" fill="#6d3a1f" stroke="#d9995a" stroke-width="6"/>
    <circle cx="1203" cy="628" r="42" fill="none" stroke="#e7ad45" stroke-width="9"/>
    <circle cx="1203" cy="628" r="10" fill="#f6cf75"/>
    <line x1="1203" y1="638" x2="1203" y2="706" stroke="#f3d694" stroke-width="6"/>
    <circle cx="1203" cy="716" r="25" fill="#e4b859"/>
    <path d="M1147 712 Q1203 758 1259 712" fill="none" stroke="#28ddff" stroke-width="5" marker-end="url(#arrC)"/>
    <text x="1310" y="593" class="sans white small">Поддерживаются</text>
    <text x="1310" y="625" class="sans white small">внутренним источником</text>
    <text x="1310" y="657" class="sans white small">энергии при наличии</text>
    <text x="1310" y="689" class="sans white small">обратной связи.</text>
  </g>

  <rect x="28" y="812" width="1544" height="66" rx="22" fill="url(#violet)" stroke="#ba6bff" stroke-width="2"/>
  <text x="75" y="854" class="sans white" font-size="28" font-weight="800">Колебательная система —</text>
  <line x1="405" y1="825" x2="405" y2="865" stroke="#e7ddff" stroke-width="2" opacity=".8"/>
  <text x="438" y="854" class="sans white" font-size="27">система тел, совершающих колебания.</text>
</svg>