<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Свободные колебания — условия возникновения</title>
  <desc id="desc">Учебная инфографика ФИЗМАТ: устойчивое равновесие, возвращающая сила, инертность, малое сопротивление и примеры свободных колебаний.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03142c"/><stop offset=".58" stop-color="#061c3a"/><stop offset="1" stop-color="#040b1b"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b34e6"/><stop offset="1" stop-color="#a832e5"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10c9ef"/><stop offset="1" stop-color="#56e6ff"/></linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#dbeeff"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".34"/></filter>
    <marker id="arrC" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#25ddff"/></marker>
    <marker id="arrP" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#ef5ce6"/></marker>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}.white{fill:#f7fbff}.ink{fill:#0b1b39}.muted{fill:#9fb4cf}
      .h1{font-size:54px;font-weight:800}.h2{font-size:34px;font-weight:800}.h3{font-size:27px;font-weight:800}
      .body{font-size:25px;font-weight:500}.small{font-size:22px;font-weight:500}.tiny{font-size:20px;font-weight:500}
      .darkCard{fill:#081a35;stroke:#1d6d96;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 115 C160 38 250 180 400 98 S680 155 830 95 S1090 155 1250 72 S1460 132 1600 58" fill="none" stroke="#0a75d4" stroke-opacity=".45" stroke-width="2"/>
  <path d="M980 110 C1090 45 1165 180 1275 86 S1470 140 1600 72" fill="none" stroke="#a23fff" stroke-opacity=".5" stroke-width="3"/>

  <rect x="28" y="24" width="205" height="58" rx="29" fill="#183b89" stroke="#a8c8ff" stroke-width="2"/>
  <text x="130" y="63" text-anchor="middle" class="sans white" font-size="29" font-weight="800">Механика</text>
  <text x="800" y="67" text-anchor="middle" class="sans white h1">Механические колебания <tspan fill="#28d8ff">и волны</tspan></text>
  <text x="1516" y="47" text-anchor="end" class="sans white" font-size="29" font-weight="900">ФИЗМАТ</text><rect x="1460" y="60" width="58" height="6" rx="3" fill="#29d8ff"/>
  <rect x="535" y="86" width="530" height="54" rx="27" fill="url(#violet)" stroke="#e4c8ff" stroke-width="2" filter="url(#glow)"/>
  <text x="800" y="123" text-anchor="middle" class="sans white" font-size="30" font-weight="800">2. Свободные колебания</text>

  <!-- intro -->
  <g filter="url(#shadow)">
    <rect x="28" y="160" width="1544" height="145" rx="24" fill="url(#light)"/>
    <path d="M62 242 C86 182 110 182 132 242 S180 302 202 242" fill="none" stroke="#1688ef" stroke-width="11" stroke-linecap="round"/>
    <text x="248" y="207" class="sans" fill="#4720ac" font-size="34" font-weight="800">Свободные колебания —</text>
    <text x="248" y="246" class="sans ink body">колебания, происходящие после вывода системы из положения равновесия</text>
    <text x="248" y="280" class="sans ink body">без внешнего периодического воздействия.</text>
  </g>

  <rect x="30" y="326" width="900" height="60" rx="18" fill="url(#violet)" stroke="#b85eff" stroke-width="2"/>
  <text x="480" y="367" text-anchor="middle" class="sans white h2">Условия возникновения свободных колебаний</text>

  <!-- Conditions -->
  <g filter="url(#shadow)">
    <rect x="30" y="400" width="900" height="94" rx="22" class="darkCard"/>
    <circle cx="82" cy="447" r="32" fill="url(#cyan)" filter="url(#glow)"/><text x="82" y="459" text-anchor="middle" class="sans white" font-size="31" font-weight="900">1</text>
    <path d="M140 447 Q190 500 240 447" fill="none" stroke="#b7c8ef" stroke-width="14" stroke-linecap="round"/><circle cx="190" cy="462" r="19" fill="#2ab5ff"/>
    <text x="285" y="438" class="sans white body">Система должна иметь положение</text><text x="285" y="472" class="sans" fill="#31dfff" font-size="25" font-weight="800">устойчивого равновесия.</text>

    <rect x="30" y="504" width="900" height="94" rx="22" class="darkCard"/>
    <circle cx="82" cy="551" r="32" fill="#c239e8" filter="url(#glow)"/><text x="82" y="563" text-anchor="middle" class="sans white" font-size="31" font-weight="900">2</text>
    <path d="M140 551 l18 -14 l18 28 l18 -28 l18 28 l18 -14" fill="none" stroke="#e7eaf3" stroke-width="8"/>
    <circle cx="248" cy="551" r="19" fill="#ef5ce6"/><line x1="280" y1="551" x2="258" y2="551" stroke="#ef5ce6" stroke-width="5" marker-end="url(#arrP)"/>
    <text x="315" y="541" class="sans white body">При отклонении должна возникать</text><text x="315" y="575" class="sans" fill="#ef6de8" font-size="25" font-weight="800">возвращающая сила к равновесию.</text>

    <rect x="30" y="608" width="900" height="94" rx="22" class="darkCard"/>
    <circle cx="82" cy="655" r="32" fill="url(#cyan)" filter="url(#glow)"/><text x="82" y="667" text-anchor="middle" class="sans white" font-size="31" font-weight="900">3</text>
    <circle cx="190" cy="655" r="25" fill="#c9d5e6"/><circle cx="158" cy="655" r="25" fill="#c9d5e6" opacity=".18"/><circle cx="225" cy="655" r="25" fill="#c9d5e6" opacity=".35"/>
    <text x="285" y="646" class="sans white body">Система должна обладать</text><text x="285" y="680" class="sans" fill="#31dfff" font-size="25" font-weight="800">инертностью.</text>

    <rect x="30" y="712" width="900" height="94" rx="22" class="darkCard"/>
    <circle cx="82" cy="759" r="32" fill="#c239e8" filter="url(#glow)"/><text x="82" y="771" text-anchor="middle" class="sans white" font-size="31" font-weight="900">4</text>
    <rect x="145" y="740" width="75" height="38" rx="7" fill="#a9b5c8"/><line x1="132" y1="783" x2="240" y2="783" stroke="#7f92ac" stroke-width="5"/><line x1="155" y1="790" x2="145" y2="800" stroke="#65758b" stroke-width="3"/><line x1="185" y1="790" x2="175" y2="800" stroke="#65758b" stroke-width="3"/>
    <text x="285" y="750" class="sans white body">Силы трения (сопротивления)</text><text x="285" y="784" class="sans" fill="#ef6de8" font-size="25" font-weight="800">должны быть малы.</text>
  </g>

  <!-- Examples -->
  <rect x="954" y="326" width="618" height="60" rx="18" fill="#eaf8ff" stroke="#53dfff" stroke-width="2"/>
  <text x="1263" y="364" text-anchor="middle" class="sans ink" font-size="27" font-weight="800">Примеры свободных колебаний</text>

  <g filter="url(#shadow)">
    <rect x="954" y="400" width="300" height="194" rx="20" class="darkCard"/>
    <path d="M1012 469 Q1104 555 1196 469" fill="none" stroke="#b7c8ef" stroke-width="16" stroke-linecap="round"/>
    <circle cx="1104" cy="507" r="24" fill="#24b4ff"/>
    <circle cx="1043" cy="469" r="22" fill="none" stroke="#6acbff" stroke-width="3" stroke-dasharray="8 6"/><circle cx="1164" cy="469" r="22" fill="none" stroke="#6acbff" stroke-width="3" stroke-dasharray="8 6"/>
    <path d="M1058 478 Q1080 493 1090 500" fill="none" stroke="#25ddff" stroke-width="4" marker-end="url(#arrC)"/>
    <path d="M1150 478 Q1128 493 1118 500" fill="none" stroke="#25ddff" stroke-width="4" marker-end="url(#arrC)"/>
    <text x="1104" y="566" text-anchor="middle" class="sans white tiny">Шарик в чаше</text><text x="1104" y="589" text-anchor="middle" class="sans muted" font-size="17">(устойчивое равновесие)</text>

    <rect x="1272" y="400" width="300" height="194" rx="20" class="darkCard"/>
    <rect x="1380" y="421" width="86" height="14" rx="5" fill="#a9b8d0"/>
    <path d="M1423 435 C1382 453 1465 470 1423 488 C1382 506 1465 523 1423 541" fill="none" stroke="#e7eef8" stroke-width="8"/>
    <circle cx="1423" cy="553" r="27" fill="#c9d4e3"/><line x1="1493" y1="458" x2="1493" y2="538" stroke="#28dfff" stroke-width="5" marker-start="url(#arrC)" marker-end="url(#arrC)"/>
    <text x="1422" y="582" text-anchor="middle" class="sans white tiny">Груз на пружине</text>

    <rect x="954" y="612" width="300" height="194" rx="20" class="darkCard"/>
    <rect x="1070" y="628" width="68" height="12" rx="4" fill="#afbdd3"/>
    <line x1="1104" y1="640" x2="1104" y2="733" stroke="#e7eef8" stroke-width="5"/><circle cx="1104" cy="752" r="25" fill="#c9d4e3"/>
    <line x1="1104" y1="640" x2="1041" y2="717" stroke="#e7eef8" stroke-width="3" stroke-dasharray="8 6" opacity=".7"/><circle cx="1041" cy="717" r="20" fill="none" stroke="#6acbff" stroke-width="3" stroke-dasharray="7 5"/>
    <line x1="1104" y1="640" x2="1166" y2="717" stroke="#e7eef8" stroke-width="3" stroke-dasharray="8 6" opacity=".7"/><circle cx="1166" cy="717" r="20" fill="none" stroke="#6acbff" stroke-width="3" stroke-dasharray="7 5"/>
    <path d="M1045 764 Q1104 802 1163 764" fill="none" stroke="#28dfff" stroke-width="4" marker-end="url(#arrC)"/>
    <text x="1104" y="790" text-anchor="middle" class="sans white tiny">Маятник</text>

    <rect x="1272" y="612" width="300" height="194" rx="20" class="darkCard"/>
    <text x="1422" y="647" text-anchor="middle" class="sans white" font-size="19" font-weight="700">Возвращающая сила</text>
    <text x="1422" y="672" text-anchor="middle" class="sans white" font-size="19" font-weight="700">направлена к равновесию</text>
    <line x1="1315" y1="733" x2="1530" y2="733" stroke="#5fdcff" stroke-width="4"/>
    <circle cx="1422" cy="717" r="23" fill="#ef5ce6"/><circle cx="1342" cy="717" r="20" fill="#ef5ce6" opacity=".22"/><circle cx="1502" cy="717" r="20" fill="#ef5ce6" opacity=".22"/>
    <line x1="1360" y1="717" x2="1394" y2="717" stroke="#ef5ce6" stroke-width="5" marker-end="url(#arrP)"/><line x1="1484" y1="717" x2="1450" y2="717" stroke="#ef5ce6" stroke-width="5" marker-end="url(#arrP)"/>
    <text x="1342" y="775" text-anchor="middle" class="sans muted" font-size="18">−A</text><text x="1422" y="775" text-anchor="middle" class="sans white" font-size="18">0</text><text x="1502" y="775" text-anchor="middle" class="sans muted" font-size="18">+A</text>
  </g>

  <rect x="28" y="824" width="1544" height="56" rx="20" fill="url(#violet)" stroke="#b965ff" stroke-width="2"/>
  <circle cx="78" cy="852" r="22" fill="#d9c5ff"/><path d="M66 852 l9 9 l18 -20" fill="none" stroke="#5a2cb7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="861" class="sans white" font-size="25" font-weight="800">Если выполняются эти условия, система может совершать <tspan fill="#36e5ff">свободные колебания.</tspan></text>
</svg>