<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#e3f5ff"/><rect x="35" y="24" width="110" height="110" rx="55" fill="#1d86db"/><text x="90" y="75" text-anchor="middle" font-family="Arial" font-size="51" fill="white" font-weight="bold">1</text><text x="90" y="110" text-anchor="middle" font-family="Arial" font-size="28" fill="white">/4</text><text x="185" y="89" font-family="Arial" font-size="70" font-weight="bold" fill="#072954">Гармонические колебания</text><rect x="184" y="106" rx="25" width="930" height="60" fill="#c6e5fb"/><text x="220" y="149" font-family="Arial" font-size="36" font-weight="bold" fill="#0c5eab">Основные понятия и кинематика</text>
<rect x="35" y="192" width="750" height="305" rx="24" fill="#fbfdff" stroke="#abd5f2" stroke-width="3"/><rect x="51" y="210" width="718" height="65" rx="20" fill="#d5edff"/><text x="77" y="255" font-family="Arial" font-size="33" font-weight="bold" fill="#12396b">Определение</text>
<text x="76" y="315" font-family="Georgia,Arial" font-size="31" fill="#112d54">Гармонические колебания — колебания,</text>
<text x="76" y="369" font-family="Georgia,Arial" font-size="31" fill="#112d54">при которых координата изменяется</text>
<text x="76" y="423" font-family="Georgia,Arial" font-size="31" fill="#112d54">по закону синуса или косинуса.</text>
<rect x="815" y="192" width="750" height="305" rx="24" fill="#fbfdff" stroke="#abd5f2" stroke-width="3"/><rect x="831" y="210" width="718" height="65" rx="20" fill="#d5edff"/><text x="857" y="255" font-family="Arial" font-size="33" font-weight="bold" fill="#12396b">Уравнение движения</text>
<text x="856" y="315" font-family="Georgia,Arial" font-size="31" fill="#112d54">x(t) = A cos(ωt + φ₀)</text>
<text x="856" y="369" font-family="Georgia,Arial" font-size="31" fill="#112d54">x(t) = A sin(ωt + φ₀)</text>
<rect x="35" y="516" width="750" height="305" rx="24" fill="#fbfdff" stroke="#abd5f2" stroke-width="3"/><rect x="51" y="534" width="718" height="65" rx="20" fill="#d5edff"/><text x="77" y="579" font-family="Arial" font-size="33" font-weight="bold" fill="#12396b">Фаза и амплитуда</text>
<text x="76" y="639" font-family="Georgia,Arial" font-size="31" fill="#112d54">A — амплитуда, [м]</text>
<text x="76" y="693" font-family="Georgia,Arial" font-size="31" fill="#112d54">φ = ωt + φ₀ — фаза, [рад]</text>
<text x="76" y="747" font-family="Georgia,Arial" font-size="31" fill="#112d54">ω — круговая частота, [рад/с]</text>
<rect x="815" y="516" width="750" height="305" rx="24" fill="#fbfdff" stroke="#abd5f2" stroke-width="3"/><rect x="831" y="534" width="718" height="65" rx="20" fill="#d5edff"/><text x="857" y="579" font-family="Arial" font-size="33" font-weight="bold" fill="#12396b">Период и частота</text>
<text x="856" y="639" font-family="Georgia,Arial" font-size="31" fill="#112d54">T = 1/ν = 2π/ω</text>
<text x="856" y="693" font-family="Georgia,Arial" font-size="31" fill="#112d54">ν = 1/T</text>
<text x="856" y="747" font-family="Georgia,Arial" font-size="31" fill="#112d54">ω = 2πν = 2π/T</text>
<rect x="34" y="851" width="1530" height="31" rx="15" fill="#b5e4ff"/><text x="800" y="875" font-family="Arial" font-size="18" text-anchor="middle" fill="#173e6a">ФИЗМАТ · ЕГЭ Физика · Теория · Гармонические колебания</text></svg>