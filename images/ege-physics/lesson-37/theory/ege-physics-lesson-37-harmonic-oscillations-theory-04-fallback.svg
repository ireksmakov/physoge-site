<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#e3f5ff"/><rect x="35" y="24" width="110" height="110" rx="55" fill="#1d86db"/><text x="90" y="75" text-anchor="middle" font-family="Arial" font-size="51" fill="white" font-weight="bold">4</text><text x="90" y="110" text-anchor="middle" font-family="Arial" font-size="28" fill="white">/4</text><text x="185" y="89" font-family="Arial" font-size="70" font-weight="bold" fill="#072954">Гармонические колебания</text><rect x="184" y="106" rx="25" width="930" height="60" fill="#c6e5fb"/><text x="220" y="149" font-family="Arial" font-size="36" font-weight="bold" fill="#0c5eab">Краткий конспект для ЕГЭ</text>
<rect x="35" y="192" width="750" height="305" rx="24" fill="#fbfdff" stroke="#abd5f2" stroke-width="3"/><rect x="51" y="210" width="718" height="65" rx="20" fill="#d5edff"/><text x="77" y="255" font-family="Arial" font-size="33" font-weight="bold" fill="#12396b">Основные формулы</text>
<text x="76" y="315" font-family="Georgia,Arial" font-size="31" fill="#112d54">x(t) = A cos(ωt + φ₀)</text>
<text x="76" y="369" font-family="Georgia,Arial" font-size="31" fill="#112d54">v(t) = −Aω sin(ωt + φ₀)</text>
<text x="76" y="423" font-family="Georgia,Arial" font-size="31" fill="#112d54">a(t) = −ω²x(t)</text>
<rect x="815" y="192" width="750" height="305" rx="24" fill="#fbfdff" stroke="#abd5f2" stroke-width="3"/><rect x="831" y="210" width="718" height="65" rx="20" fill="#d5edff"/><text x="857" y="255" font-family="Arial" font-size="33" font-weight="bold" fill="#12396b">Связи величин</text>
<text x="856" y="315" font-family="Georgia,Arial" font-size="31" fill="#112d54">T = 1/ν = 2π/ω</text>
<text x="856" y="369" font-family="Georgia,Arial" font-size="31" fill="#112d54">vₘₐₓ = Aω</text>
<text x="856" y="423" font-family="Georgia,Arial" font-size="31" fill="#112d54">aₘₐₓ = Aω²</text>
<rect x="35" y="516" width="750" height="305" rx="24" fill="#fbfdff" stroke="#abd5f2" stroke-width="3"/><rect x="51" y="534" width="718" height="65" rx="20" fill="#d5edff"/><text x="77" y="579" font-family="Arial" font-size="33" font-weight="bold" fill="#12396b">Единицы измерения</text>
<text x="76" y="639" font-family="Georgia,Arial" font-size="31" fill="#112d54">A — метры, T — секунды</text>
<text x="76" y="693" font-family="Georgia,Arial" font-size="31" fill="#112d54">ν — герцы, ω — рад/с</text>
<text x="76" y="747" font-family="Georgia,Arial" font-size="31" fill="#112d54">φ и φ₀ — радианы</text>
<rect x="815" y="516" width="750" height="305" rx="24" fill="#fbfdff" stroke="#abd5f2" stroke-width="3"/><rect x="831" y="534" width="718" height="65" rx="20" fill="#d5edff"/><text x="857" y="579" font-family="Arial" font-size="33" font-weight="bold" fill="#12396b">Что нужно помнить</text>
<text x="856" y="639" font-family="Georgia,Arial" font-size="31" fill="#112d54">При x = 0 скорость максимальна.</text>
<text x="856" y="693" font-family="Georgia,Arial" font-size="31" fill="#112d54">При x = ±A скорость равна нулю.</text>
<text x="856" y="747" font-family="Georgia,Arial" font-size="31" fill="#112d54">Ускорение направлено к равновесию.</text>
<rect x="34" y="851" width="1530" height="31" rx="15" fill="#b5e4ff"/><text x="800" y="875" font-family="Arial" font-size="18" text-anchor="middle" fill="#173e6a">ФИЗМАТ · ЕГЭ Физика · Теория · Гармонические колебания</text></svg>