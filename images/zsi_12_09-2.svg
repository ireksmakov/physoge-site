<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="70" y="82" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="42" font-weight="700">Векторная схема после распада</text>
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="context-stroke"/></marker>
  </defs>
  <line x1="170" y1="610" x2="930" y2="610" stroke="#e2e8f0" stroke-width="4"/>
  <line x1="170" y1="610" x2="170" y2="130" stroke="#e2e8f0" stroke-width="4"/>
  <text x="945" y="622" fill="#64748b" font-family="Arial" font-size="24">x</text>
  <text x="155" y="120" fill="#64748b" font-family="Arial" font-size="24">y</text>
  <line x1="170" y1="610" x2="530" y2="610" stroke="#08d8ff" stroke-width="10" marker-end="url(#a)"/>
  <text x="320" y="650" fill="#0891b2" font-family="Arial" font-size="30" font-weight="700">p₀→</text>
  <line x1="170" y1="610" x2="170" y2="300" stroke="#22c55e" stroke-width="10" marker-end="url(#a)"/>
  <text x="90" y="455" fill="#16a34a" font-family="Arial" font-size="30" font-weight="700">p₁→</text>
  <line x1="170" y1="610" x2="710" y2="720" stroke="#ff8c00" stroke-width="10" marker-end="url(#a)"/>
  <text x="460" y="706" fill="#ea580c" font-family="Arial" font-size="30" font-weight="700">p₂→</text>
  <text x="585" y="300" fill="#0f172a" font-family="Arial" font-size="28">v₁→ = v₀→ вверх</text>
  <text x="585" y="355" fill="#0f172a" font-family="Arial" font-size="28">v₂→ = 5v₀→ вниз-вправо</text>
  <rect x="585" y="410" width="500" height="110" rx="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
  <text x="625" y="475" fill="#1e3a8a" font-family="Arial" font-size="34" font-weight="700">p₀→ = p₁→ + p₂→</text>
  <text x="585" y="590" fill="#334155" font-family="Arial" font-size="24">Проекции по осям помогают учесть направления</text>
  <text x="585" y="625" fill="#334155" font-family="Arial" font-size="24">и найти неизвестные величины.</text>
</svg>
